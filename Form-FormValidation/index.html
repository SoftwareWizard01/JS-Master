<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Validator</title>
  </head>
  <link rel="stylesheet" href="style.css" />
  <body>
    <div class="container">
      <form class="form">
        <h2>Login</h2>

        <!-- Email -->
        <div class="input-group">
          <label for="email">Email</label>
          <input
            autocomplete="off"
            type="text"
            id="email"
            placeholder="Enter your email"
          />
          <small class="emailerror">Error message</small>
        </div>

        <!-- Password -->
        <div class="input-group">
          <label for="password">Password</label>
          <input
            type="password"
            autocomplete="off"
            id="password"
            placeholder="Enter your password"
          />
          <small class="passworderror">Error message</small>
        </div>

        <button type="submit">Submit</button>
      </form>
    </div>
    <script src="fileval.js"></script>
  </body>
</html>
